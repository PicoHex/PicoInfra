name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  # ---------------------------------------------------------------------------
  # Pack
  # ---------------------------------------------------------------------------
  pack:
    name: Pack packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Consumed by `publish` (job name, and the release title once it needs it).
    # Without this block `needs.pack.outputs.version` is undefined and the
    # consuming expression silently falls through to its `||` default.
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Parse version from tag
        id: version
        shell: bash
        run: |
          ref_name="${GITHUB_REF_NAME}"
          # Strip leading 'v'
          VERSION="${ref_name#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run all tests
        shell: bash
        run: |
          mkdir -p ./artifacts/nupkg
          dotnet test --project PicoDI/tests/PicoDI.Test/PicoDI.Test.csproj --configuration Release
          dotnet test --project PicoCfg/tests/PicoCfg.Tests/PicoCfg.Tests.csproj --configuration Release
          dotnet test --project PicoCfg/tests/PicoCfg.Gen.Tests/PicoCfg.Gen.Tests.csproj --configuration Release
          dotnet test --project PicoCfg/tests/PicoCfg.DI.Tests/PicoCfg.DI.Tests.csproj --configuration Release
          dotnet test --project PicoCfg/tests/PicoCfg.Json.Tests/PicoCfg.Json.Tests.csproj --configuration Release
          dotnet test --project PicoCfg/tests/PicoCfg.Yaml.Tests/PicoCfg.Yaml.Tests.csproj --configuration Release
          dotnet test --project PicoCfg/tests/PicoCfg.Ini.Tests/PicoCfg.Ini.Tests.csproj --configuration Release
          dotnet test --project PicoCfg/tests/PicoCfg.Toml.Tests/PicoCfg.Toml.Tests.csproj --configuration Release
          dotnet test --project PicoLog/tests/PicoLog.Tests/PicoLog.Tests.csproj --configuration Release
          dotnet test --project PicoLog/tests/PicoLog.Json.Tests/PicoLog.Json.Tests.csproj --configuration Release
          dotnet test --project PicoAop/tests/PicoAop.Tests/PicoAop.Tests.csproj --configuration Release
          dotnet test --project PicoMediator/tests/PicoMediator.Tests/PicoMediator.Tests.csproj --configuration Release
          dotnet test --project PicoSchedule/tests/PicoSchedule.Tests/PicoSchedule.Tests.csproj --configuration Release

      - name: Pack all packages
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NUPKG_DIR="$GITHUB_WORKSPACE/artifacts/nupkg"
          rm -rf ./artifacts/nupkg
          mkdir -p ./artifacts/nupkg

          # ---- Phase 1: Abstractions (bundled generators via UseProjectReferences=true) ----
          # PicoDI.Abs must be packed first because PicoAop.Abs depends on it
          dotnet pack PicoDI/src/PicoDI.Abs/PicoDI.Abs.csproj \
            --configuration Release \
            --output "$NUPKG_DIR" \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=true

          dotnet pack PicoAop/src/PicoAop.Abs/PicoAop.Abs.csproj \
            --configuration Release \
            --output "$NUPKG_DIR" \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=true \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR"
          # ---- PicoSchedule (standalone, zero dependencies) ----
          dotnet pack PicoSchedule/src/PicoSchedule/PicoSchedule.csproj \
            --configuration Release \
            --output "$NUPKG_DIR" \
            -p:Version="$VERSION"

          dotnet pack PicoMediator/src/PicoMediator.Abs/PicoMediator.Abs.csproj \
            --configuration Release \
            --output "$NUPKG_DIR" \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=true

          dotnet pack PicoCfg/src/PicoCfg.Abs/PicoCfg.Abs.csproj \
            --configuration Release \
            --output "$NUPKG_DIR" \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=true

          dotnet pack PicoLog/src/PicoLog.Abs/PicoLog.Abs.csproj \
            --configuration Release \
            --output "$NUPKG_DIR" \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=true

          # ---- Phase 2: Consumer libraries (depend on abstractions from Phase 1) ----
          dotnet pack PicoAop/src/PicoAop.DI/PicoAop.DI.csproj \
            --configuration Release \
            --output "$NUPKG_DIR" \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=false \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR"

          dotnet pack PicoMediator/src/PicoMediator/PicoMediator.csproj \
            --configuration Release \
            --output "$NUPKG_DIR" \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=false \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR"

          dotnet pack PicoMediator/src/PicoMediator.DI/PicoMediator.DI.csproj \
            --configuration Release \
            --output "$NUPKG_DIR" \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=false \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR"

          dotnet pack PicoDI/src/PicoDI/PicoDI.csproj \
            --configuration Release \
            --output "$NUPKG_DIR" \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=false \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR"

          dotnet pack PicoCfg/src/PicoCfg/PicoCfg.csproj \
            --configuration Release \
            --output "$NUPKG_DIR" \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=false \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR"

          dotnet pack PicoCfg/src/PicoCfg.DI/PicoCfg.DI.csproj \
            --configuration Release \
            --output "$NUPKG_DIR" \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=false \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR"

          # ---- Phase 3: SerDe (depend on Phase 1 abstractions + Phase 2 consumer libs) ----
          dotnet pack PicoCfg/src/PicoCfg.Json/PicoCfg.Json.csproj \
            --configuration Release \
            --output "$NUPKG_DIR" \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=false \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR"

          dotnet pack PicoCfg/src/PicoCfg.Yaml/PicoCfg.Yaml.csproj \
            --configuration Release \
            --output "$NUPKG_DIR" \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=false \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR"

          dotnet pack PicoCfg/src/PicoCfg.Ini/PicoCfg.Ini.csproj \
            --configuration Release \
            --output "$NUPKG_DIR" \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=false \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR"

          dotnet pack PicoCfg/src/PicoCfg.Toml/PicoCfg.Toml.csproj \
            --configuration Release \
            --output "$NUPKG_DIR" \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=false \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR"

          dotnet pack PicoLog/src/PicoLog/PicoLog.csproj \
            --configuration Release \
            --output "$NUPKG_DIR" \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=false \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR"

          dotnet pack PicoLog/src/PicoLog.DI/PicoLog.DI.csproj \
            --configuration Release \
            --output "$NUPKG_DIR" \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=false \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR"

          dotnet pack PicoLog/src/PicoLog.Json/PicoLog.Json.csproj \
            --configuration Release \
            --output "$NUPKG_DIR" \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=false \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR"

          dotnet pack PicoAop/src/PicoAop/PicoAop.csproj \
            --configuration Release \
            --output "$NUPKG_DIR" \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=false \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: |
            ./artifacts/nupkg/*.nupkg
            ./artifacts/nupkg/*.snupkg

  # ---------------------------------------------------------------------------
  # Publish
  # ---------------------------------------------------------------------------
  publish:
    name: Publish ${{ needs.pack.outputs.version || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: pack
    environment: release
    permissions:
      contents: write
      # GitHub OIDC: lets this job mint the identity token nuget.org trades for a
      # short-lived API key. Without it the login step has nothing to present.
      id-token: write

    steps:
      # Checkout must come BEFORE the artifact download: `actions/checkout`
      # runs `git clean -ffdx`, which would delete package files already
      # extracted into the workspace.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download package artifacts
        # v8 is the counterpart of `upload-artifact@v7` used by `pack`: both run
        # on node24 and speak the same @actions/artifact protocol, and v8 added
        # the "do not unzip non-zipped artifacts" handling that pairs with v7's
        # direct-upload support. Do not bump one without the other.
        uses: actions/download-artifact@v8
        with:
          name: nupkg

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages to NuGet
        shell: bash
        run: |
          shopt -s nullglob
          packages=()
          symbols=()

          # `*.nupkg` never matches `*.snupkg`, so symbol packages are NOT part
          # of this glob - they get their own loop below. The guard that remains
          # here only ever fires for the legacy `*.symbols.nupkg` archive format,
          # which nuget.org rejects on the packages endpoint.
          for file in *.nupkg; do
            if [[ "$file" == *.symbols.nupkg ]]; then
              echo "::warning::Skipping legacy symbol package '$file' (only .snupkg is published)."
              continue
            fi
            packages+=("$file")
          done

          for file in *.snupkg; do
            symbols+=("$file")
          done

          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "::error::No .nupkg files in $(pwd) - nothing to publish."
            exit 1
          fi

          echo "Publishing ${#packages[@]} package(s) and ${#symbols[@]} symbol package(s)."

          for file in "${packages[@]}"; do
            dotnet nuget push "$file" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

          # Symbol packages: same endpoint, pushed after their .nupkg so the
          # version already exists on the feed. --skip-duplicate keeps re-runs
          # idempotent, exactly like the package loop.
          for file in "${symbols[@]}"; do
            dotnet nuget push "$file" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

          echo "Published ${#packages[@]} package(s) and ${#symbols[@]} symbol package(s)."

      - name: Resolve release notes for ${{ github.ref_name }}
        id: notes
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="docs/release-notes/${tag}.md"
          # Fail loudly: a release page with silently empty notes is worse than
          # a red run.
          if [[ ! -f "$notes" ]]; then
            echo "::error::Missing release notes file '$notes' for tag '$tag'. Write it before tagging."
            exit 1
          fi
          if [[ ! -s "$notes" ]]; then
            echo "::error::Release notes file '$notes' is empty."
            exit 1
          fi
          bytes=$(wc -c < "$notes")
          # GitHub caps a release body at 125000 characters and the action
          # truncates silently, so warn before the tail disappears.
          if [[ "$bytes" -gt 120000 ]]; then
            echo "::warning::'$notes' is $bytes bytes, near GitHub's 125000-char release body cap."
          fi
          echo "path=$notes" >> "$GITHUB_OUTPUT"
          echo "Release notes: $notes ($bytes bytes)"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          # Human-written notes first, then the auto-generated compare link:
          # with both `body_path` and `generate_release_notes`, the action sets
          # body = "<file contents>" + blank line + <generated notes>.
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          files: |
            *.nupkg
            *.snupkg
