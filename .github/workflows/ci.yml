        shell: bash
        run: |
          rm -rf ./artifacts/ci-nupkg
          rm -rf ./artifacts/ci-packages
          mkdir -p ./artifacts/ci-nupkg
          mkdir -p ./artifacts/ci-packages/abs ./artifacts/ci-packages/mediator ./artifacts/ci-packages/di

          VERSION="0.0.0-ci"
          NUPKG_DIR="$GITHUB_WORKSPACE/artifacts/ci-nupkg"
          NUGET_SOURCE="https://api.nuget.org/v3/index.json"

          dotnet pack PicoMediator/src/PicoMediator.Abs/PicoMediator.Abs.csproj \
            --configuration Release \
            --output ./artifacts/ci-nupkg \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=true \
            -p:RestoreSources="$NUGET_SOURCE" \
            -p:RestorePackagesPath="$GITHUB_WORKSPACE/artifacts/ci-packages/abs"

          dotnet pack PicoMediator/src/PicoMediator/PicoMediator.csproj \
            --configuration Release \
            --output ./artifacts/ci-nupkg \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=true \
            -p:RestoreSources="$NUGET_SOURCE" \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR" \
            -p:RestorePackagesPath="$GITHUB_WORKSPACE/artifacts/ci-packages/mediator"

          dotnet pack PicoMediator/src/PicoMediator.DI/PicoMediator.DI.csproj \
            --configuration Release \
            --output ./artifacts/ci-nupkg \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=true \
            -p:RestoreSources="$NUGET_SOURCE" \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR" \
            -p:RestorePackagesPath="$GITHUB_WORKSPACE/artifacts/ci-packages/di"

