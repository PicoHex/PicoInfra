name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force-all:
        description: "Force run all modules (ignore path filter)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

# ---------------------------------------------------------------------------
# Step gating policy - read this before adding or removing an `if:` on a step
#
# A step that fails stops the rest of its job, because `if: success()` is implicit. That default
# is correct for steps that ship or produce deliverables: this workflow never packs packages or
# builds a sample off a red test run, and release.yml never packs packages off a red test run
# either.
#
# The default is wrong for steps that report: a verdict-producing gate, a hang/crash-dump upload,
# a coverage upload. Downstream of a failed test step those silently become `skipped`, and in the
# run summary "skipped" is indistinguishable from "checked and green". That is exactly how run
# 41780481138 hid two things at once: the PicoLog `AOT publish validation` gate never ran on any
# RID (skipped on 8a41039 at step 7/8 and again on 8c11707 at step 7/11), and the coverage-picolog
# artifact was never uploaded even though its 673,846 B report was sitting in picolog-dumps.
#
# So every reporting step carries an explicit `if: ${{ !cancelled() }}`, ANDed with whatever matrix
# condition it already had. `!cancelled()` means "still run if an earlier step failed, but stand
# down on an explicit cancel" - unlike `always()`, a cancelled run does not go on publishing.
#
# Running the AOT gate on a red job cannot ship a broken artifact: nothing in this workflow pushes
# to a feed, and the `dotnet publish` output is never uploaded. The gate only adds its own step
# verdict - and a hard job failure if the publish really is broken.
#
# Current split, per job: Run/*tests* -> default, they gate everything after them.
#                        AOT publish validation, coverage upload, dump upload -> !cancelled().
#                        Pack CI packages, sample smoke tests, publish!=run guard -> default.
#                        api/ verdict (verify) -> default; surface delta report -> !cancelled().
# ---------------------------------------------------------------------------

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pico-di: ${{ steps.filter.outputs.pico-di }}
      pico-cfg: ${{ steps.filter.outputs.pico-cfg }}
      pico-log: ${{ steps.filter.outputs.pico-log }}
      pico-aop: ${{ steps.filter.outputs.pico-aop }}
      pico-mediator: ${{ steps.filter.outputs.pico-mediator }}
      pico-schedule: ${{ steps.filter.outputs.pico-schedule }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pico-di:
              - 'PicoDI/**'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - '.github/**'
              - 'global.json'
            pico-mediator:
              - 'PicoMediator/**'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - '.github/**'
              - 'global.json'
            pico-cfg:
              - 'PicoCfg/**'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - '.github/**'
              - 'global.json'
            pico-aop:
              - 'PicoAop/**'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - '.github/**'
              - 'global.json'
            pico-log:
              - 'PicoLog/**'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - '.github/**'
              - 'global.json'
            pico-schedule:
              - 'PicoSchedule/**'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - '.github/**'
              - 'global.json'

  # ---------------------------------------------------------------------------
  # Formatting — repo-wide, no path filter: cheap and catches every PR
  # ---------------------------------------------------------------------------
  format:
    name: Format (CSharpier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore local tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check .

  # ---------------------------------------------------------------------------
  # Release parity — the local release script must pack what the workflow packs
  # ---------------------------------------------------------------------------
  consistency:
    name: Release parity (script ↔ workflow)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check scripts/release.ps1 packs the same projects as release.yml
        run: bash scripts/check-release-parity.sh

  # ---------------------------------------------------------------------------
  # API baselines — `api/` is generated output, and this is the gate that says so
  #
  # `api/<PackageId>.public.txt` (20 files) is the public surface of the LAST
  # RELEASE: the release tool writes it from the tagged tree, and it is committed
  # so the next version can be decided from a diff. Nothing used to read it, so a
  # hand-edit was invisible until a human ran the release tool. That is the hole
  # this job closes, and the rule it states where a contributor will see it:
  #
  #   api/ IS GENERATED. NEVER EDIT IT. It is not documentation and not a
  #   changelog. A PR that changes the public surface does NOT touch api/: the
  #   next release refreshes it from the tagged tree and bumps x. Editing it makes
  #   the release tool compare the tree against a baseline that already matches
  #   it, so it reports "API unchanged" and answers with a y bump where an x is
  #   due — a breaking change shipped as a patch (docs/releasing.md).
  #
  # Semantics enforced: (a) drift detector. `api/` must be byte-identical to
  # `api/` at the newest release tag reachable from HEAD
  # (scripts/check-api-baselines.sh verify: ~2 s, no build, no NuGet feed, no
  # sibling repositories). Development moves freely. A "compare api/ with the
  # current tree" gate is wrong for this repository specifically: the baselines
  # deliberately lag `main` between releases, so such a gate is red for every
  # post-release commit that adds API, and the only way to green it is the early
  # refresh that corrupts the version decision.
  #
  # Rejected (b) forward-check, "fail only on removals relative to the
  # baselines". It has the best story for the last cycle — it would have gone red
  # at edf2cfd (2026-11-02, `bool flattenArrays = false` added to AddToml /
  # AddYaml: source-compatible, binary-breaking) and at 5729d95 (2026-11-03,
  # SeqSink moved out of PicoLog into PicoLog.Json, a removal in
  # PicoLog.public.txt). But those are the commits that *legitimately* removed
  # surface, so `main` would have been red for the four days until v2026.11.0 was
  # tagged on 2026-11-06 — and the cheapest way to silence that is the one
  # action that corrupts the version decision. It also cannot see the hand-edit
  # that masks a change (add the member, hand-add the line): extraction at HEAD
  # then equals the edited baseline, the gate is green, and the release answers y.
  # Only a tag-relative check sees that one.
  # Rejected (c) strict, "every surface-touching PR refreshes api/". A policy
  # change that makes the release tool's delta empty by construction, which is
  # exactly the trap docs/releasing.md warns about.
  #
  # What the last release cycle would have done here, and when:
  #   da73005 2026-11-03 `CfgKeyCollisionException` (pure addition, +4 lines)
  #     — green at the PR, as it should be; the advisory step reports +4 and the
  #       next release as an x bump. Nothing to fix in that PR.
  #   edf2cfd + 5729d95, the two removals (the flattenArrays signatures, the
  #   SeqSink move; -2/+2 and -13/+12)
  #     — green at the PR (a legitimate break stays green under (a)), reported by
  #       the advisory step, and caught for certain by the release tool at tag
  #       time, which is where the x bump (10.1 -> 11.0) was decided.
  #   the hand-edited variant of any of them — red here, at PR time. Nothing
  #   caught that before.
  #
  # The second step is advisory on purpose: it builds the tree, extracts the
  # surface of every packable assembly with scripts/api-surface, prints the delta
  # against api/ and the version that delta implies, and writes it to the job
  # summary. It fails only when it cannot extract (build or tool failure) — a gate
  # that skips silently is indistinguishable from one that checked.
  # ---------------------------------------------------------------------------
  api-baselines:
    name: API baselines (generated)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 — the verdict compares against a release tag, so the tags
      # have to be in the clone.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: api/ still describes the last release (api/ is never hand-edited)
        run: bash scripts/check-api-baselines.sh verify

      # Reporting step: runs on a red job by design (see "Step gating policy").
      - name: Surface delta since the last release (advisory)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p ./artifacts/nupkg
          bash scripts/check-api-baselines.sh report

  # ---------------------------------------------------------------------------
  # PicoDI
  # ---------------------------------------------------------------------------
  validate-picodi:
    name: PicoDI (${{ matrix.logical-target }})
    needs: changes
    if: needs.changes.outputs.pico-di == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - logical-target: win-x64
            runs-on: windows-latest
            rid: win-x64
          - logical-target: win-arm64
            runs-on: windows-11-arm
            rid: win-arm64
          - logical-target: linux-x64
            runs-on: ubuntu-latest
            rid: linux-x64
          - logical-target: linux-arm64
            runs-on: ubuntu-24.04-arm
            rid: linux-arm64
          - logical-target: osx-arm64
            runs-on: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Linux AOT prerequisites
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
          if [[ "${{ matrix.rid }}" == "linux-arm64" ]]; then
            sudo apt-get install -y gcc binutils
          fi

      - name: Restore dependencies
        run: |
          mkdir -p ./artifacts/nupkg
          dotnet restore PicoDI/tests/PicoDI.Test/PicoDI.Test.csproj -p:UseProjectReferences=true -p:RestoreLockedMode=true

      - name: Build
        run: dotnet build PicoDI/tests/PicoDI.Test/PicoDI.Test.csproj --configuration Release --no-restore -p:UseProjectReferences=true

      # --coverage-output names the report and --results-directory picks the folder: without both,
      # Microsoft.Testing.Platform writes a GUID-named file into <cwd>/TestResults, which the upload
      # below cannot match. (Same shape as the PicoLog legs.)
      - name: Run tests (coverage)
        if: matrix.rid == 'linux-x64'
        run: dotnet test --project PicoDI/tests/PicoDI.Test/PicoDI.Test.csproj --configuration Release --no-build --verbosity normal --no-progress -p:UseProjectReferences=true --coverage --coverage-output picodi-test.cobertura.xml --coverage-output-format cobertura -- --results-directory=${{ github.workspace }}/artifacts/test-results
      - name: Run tests
        if: matrix.rid != 'linux-x64'
        run: dotnet test --project PicoDI/tests/PicoDI.Test/PicoDI.Test.csproj --configuration Release --no-build --verbosity normal --no-progress -p:UseProjectReferences=true
      # Diagnostic step: runs on a red job by design (see "Step gating policy" at the top).
      - name: Upload coverage
        if: ${{ !cancelled() && matrix.rid == 'linux-x64' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-picodi
          path: ${{ github.workspace }}/artifacts/test-results/picodi-test.cobertura.xml
          # An upload that matches nothing is how this artefact stayed empty: fail instead.
          if-no-files-found: error

      # Diagnostic gate: runs on a red job by design (see "Step gating policy" at the top).
      - name: AOT publish validation
        if: ${{ !cancelled() }}
        run: dotnet publish PicoDI/src/PicoDI/ -p:PublishAot=true -r ${{ matrix.rid }} --configuration Release

      # Gated on purpose (implicit if: success()): nothing is shipped off a red test run.
      - name: Run PicoDI.Sample (managed smoke test)
        run: dotnet run --project PicoDI/samples/PicoDI.Sample/ -c Release -p:PublishAot=false

      # Gated on purpose (implicit if: success()): nothing is shipped off a red test run.
      - name: Run PicoDI.Sample.Host (managed smoke test)
        run: dotnet run --project PicoDI/samples/PicoDI.Sample.Host/ -c Release -p:PublishAot=false

      # Gated on purpose (implicit if: success()): nothing is shipped off a red test run.
      - name: Pack CI packages (package-consumer validation)
        shell: bash
        run: |
          rm -rf ./artifacts/ci-nupkg
          rm -rf ./artifacts/ci-packages
          mkdir -p ./artifacts/ci-nupkg
          mkdir -p ./artifacts/ci-packages/abs ./artifacts/ci-packages/pico

          VERSION="0.0.0-ci"
          NUPKG_DIR="$GITHUB_WORKSPACE/artifacts/ci-nupkg"
          NUGET_SOURCE="https://api.nuget.org/v3/index.json"

          dotnet pack PicoDI/src/PicoDI.Abs/PicoDI.Abs.csproj \
            --configuration Release \
            --output ./artifacts/ci-nupkg \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=true \
            -p:RestoreSources="$NUGET_SOURCE" \
            -p:RestorePackagesPath="$GITHUB_WORKSPACE/artifacts/ci-packages/abs"

          dotnet pack PicoDI/src/PicoDI/PicoDI.csproj \
            --configuration Release \
            --output ./artifacts/ci-nupkg \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=false \
            -p:RestoreSources="$NUGET_SOURCE" \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR" \
            -p:RestorePackagesPath="$GITHUB_WORKSPACE/artifacts/ci-packages/pico"

  # ---------------------------------------------------------------------------
  # PicoCfg
  # ---------------------------------------------------------------------------
  validate-picocfg:
    name: PicoCfg (${{ matrix.logical-target }})
    needs: changes
    if: needs.changes.outputs.pico-cfg == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - logical-target: win-x64
            runs-on: windows-latest
            rid: win-x64
          - logical-target: win-arm64
            runs-on: windows-11-arm
            rid: win-arm64
          - logical-target: linux-x64
            runs-on: ubuntu-latest
            rid: linux-x64
          - logical-target: linux-arm64
            runs-on: ubuntu-24.04-arm
            rid: linux-arm64
          - logical-target: osx-arm64
            runs-on: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Linux AOT prerequisites
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
          if [[ "${{ matrix.rid }}" == "linux-arm64" ]]; then
            sudo apt-get install -y gcc binutils
          fi

      - name: Restore dependencies
        run: |
          mkdir -p ./artifacts/nupkg
          dotnet restore PicoCfg/tests/PicoCfg.Tests/PicoCfg.Tests.csproj -p:UseProjectReferences=true -p:RestoreLockedMode=true
          dotnet restore PicoCfg/tests/PicoCfg.Gen.Tests/PicoCfg.Gen.Tests.csproj -p:UseProjectReferences=true -p:RestoreLockedMode=true
          dotnet restore PicoCfg/tests/PicoCfg.DI.Tests/PicoCfg.DI.Tests.csproj -p:UseProjectReferences=true -p:RestoreLockedMode=true
          dotnet restore PicoCfg/tests/PicoCfg.Json.Tests/PicoCfg.Json.Tests.csproj -p:UseProjectReferences=true -p:RestoreLockedMode=true
          dotnet restore PicoCfg/tests/PicoCfg.Yaml.Tests/PicoCfg.Yaml.Tests.csproj -p:UseProjectReferences=true -p:RestoreLockedMode=true
          dotnet restore PicoCfg/tests/PicoCfg.Ini.Tests/PicoCfg.Ini.Tests.csproj -p:UseProjectReferences=true -p:RestoreLockedMode=true
          dotnet restore PicoCfg/tests/PicoCfg.Toml.Tests/PicoCfg.Toml.Tests.csproj -p:UseProjectReferences=true -p:RestoreLockedMode=true

      - name: Build
        run: |
          dotnet build PicoCfg/tests/PicoCfg.Tests/PicoCfg.Tests.csproj --configuration Release --no-restore -p:UseProjectReferences=true
          dotnet build PicoCfg/tests/PicoCfg.Gen.Tests/PicoCfg.Gen.Tests.csproj --configuration Release --no-restore -p:UseProjectReferences=true
          dotnet build PicoCfg/tests/PicoCfg.DI.Tests/PicoCfg.DI.Tests.csproj --configuration Release --no-restore -p:UseProjectReferences=true
          dotnet build PicoCfg/tests/PicoCfg.Json.Tests/PicoCfg.Json.Tests.csproj --configuration Release --no-restore -p:UseProjectReferences=true
          dotnet build PicoCfg/tests/PicoCfg.Yaml.Tests/PicoCfg.Yaml.Tests.csproj --configuration Release --no-restore -p:UseProjectReferences=true
          dotnet build PicoCfg/tests/PicoCfg.Ini.Tests/PicoCfg.Ini.Tests.csproj --configuration Release --no-restore -p:UseProjectReferences=true
          dotnet build PicoCfg/tests/PicoCfg.Toml.Tests/PicoCfg.Toml.Tests.csproj --configuration Release --no-restore -p:UseProjectReferences=true

      # --coverage-output names the report and --results-directory picks the folder: without both,
      # Microsoft.Testing.Platform writes a GUID-named file into <cwd>/TestResults, which the upload
      # below cannot match. (Same shape as the PicoLog legs.)
      - name: Run PicoCfg tests (coverage)
        if: matrix.rid == 'linux-x64'
        run: dotnet test --project PicoCfg/tests/PicoCfg.Tests/PicoCfg.Tests.csproj --configuration Release --no-build --verbosity normal --no-progress -p:UseProjectReferences=true --coverage --coverage-output picocfg-tests.cobertura.xml --coverage-output-format cobertura -- --results-directory=${{ github.workspace }}/artifacts/test-results
      - name: Run PicoCfg tests
        if: matrix.rid != 'linux-x64'
        run: dotnet test --project PicoCfg/tests/PicoCfg.Tests/PicoCfg.Tests.csproj --configuration Release --no-build --verbosity normal --no-progress -p:UseProjectReferences=true
      # Diagnostic step: runs on a red job by design (see "Step gating policy" at the top).
      - name: Upload PicoCfg coverage
        if: ${{ !cancelled() && matrix.rid == 'linux-x64' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-picocfg
          path: ${{ github.workspace }}/artifacts/test-results/picocfg-tests.cobertura.xml
          # An upload that matches nothing is how this artefact stayed empty: fail instead.
          if-no-files-found: error
      - name: Run PicoCfg.Gen tests
        run: dotnet test --project PicoCfg/tests/PicoCfg.Gen.Tests/PicoCfg.Gen.Tests.csproj --configuration Release --no-build --verbosity normal --no-progress -p:UseProjectReferences=true
      - name: Run PicoCfg.DI tests
        run: dotnet test --project PicoCfg/tests/PicoCfg.DI.Tests/PicoCfg.DI.Tests.csproj --configuration Release --no-build --verbosity normal --no-progress -p:UseProjectReferences=true
      - name: Run PicoCfg.Json tests
        run: dotnet test --project PicoCfg/tests/PicoCfg.Json.Tests/PicoCfg.Json.Tests.csproj --configuration Release --no-build --verbosity normal --no-progress -p:UseProjectReferences=true
      - name: Run PicoCfg.Yaml tests
        run: dotnet test --project PicoCfg/tests/PicoCfg.Yaml.Tests/PicoCfg.Yaml.Tests.csproj --configuration Release --no-build --verbosity normal --no-progress -p:UseProjectReferences=true
      - name: Run PicoCfg.Ini tests
        run: dotnet test --project PicoCfg/tests/PicoCfg.Ini.Tests/PicoCfg.Ini.Tests.csproj --configuration Release --no-build --verbosity normal --no-progress -p:UseProjectReferences=true
      - name: Run PicoCfg.Toml tests
        run: dotnet test --project PicoCfg/tests/PicoCfg.Toml.Tests/PicoCfg.Toml.Tests.csproj --configuration Release --no-build --verbosity normal --no-progress -p:UseProjectReferences=true

      # Diagnostic gate: runs on a red job by design (see "Step gating policy" at the top).
      - name: AOT publish validation
        if: ${{ !cancelled() }}
        run: dotnet publish PicoCfg/src/PicoCfg/ -p:PublishAot=true -r ${{ matrix.rid }} --configuration Release

      # Gated on purpose (implicit if: success()): nothing is shipped off a red test run.
      - name: Pack CI packages (package-consumer validation)
        shell: bash
        run: |
          rm -rf ./artifacts/ci-nupkg
          rm -rf ./artifacts/ci-packages
          mkdir -p ./artifacts/ci-nupkg
          mkdir -p ./artifacts/ci-packages/abs ./artifacts/ci-packages/pico ./artifacts/ci-packages/di

          VERSION="0.0.0-ci"
          NUPKG_DIR="$GITHUB_WORKSPACE/artifacts/ci-nupkg"
          NUGET_SOURCE="https://api.nuget.org/v3/index.json"

          dotnet pack PicoCfg/src/PicoCfg.Abs/PicoCfg.Abs.csproj \
            --configuration Release \
            --output ./artifacts/ci-nupkg \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=true \
            -p:RestoreSources="$NUGET_SOURCE" \
            -p:RestorePackagesPath="$GITHUB_WORKSPACE/artifacts/ci-packages/abs"

          dotnet pack PicoCfg/src/PicoCfg/PicoCfg.csproj \
            --configuration Release \
            --output ./artifacts/ci-nupkg \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=false \
            -p:RestoreSources="$NUGET_SOURCE" \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR" \
            -p:RestorePackagesPath="$GITHUB_WORKSPACE/artifacts/ci-packages/pico"

          dotnet pack PicoCfg/src/PicoCfg.DI/PicoCfg.DI.csproj \
            --configuration Release \
            --output ./artifacts/ci-nupkg \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=true \
            -p:RestoreSources="$NUGET_SOURCE" \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR" \
            -p:RestorePackagesPath="$GITHUB_WORKSPACE/artifacts/ci-packages/di"

          dotnet pack PicoCfg/src/PicoCfg.Json/PicoCfg.Json.csproj \
            --configuration Release \
            --output ./artifacts/ci-nupkg \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=false \
            -p:RestoreSources="$NUGET_SOURCE" \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR" \
            -p:RestorePackagesPath="$GITHUB_WORKSPACE/artifacts/ci-packages/json"

          dotnet pack PicoCfg/src/PicoCfg.Yaml/PicoCfg.Yaml.csproj \
            --configuration Release \
            --output ./artifacts/ci-nupkg \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=false \
            -p:RestoreSources="$NUGET_SOURCE" \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR" \
            -p:RestorePackagesPath="$GITHUB_WORKSPACE/artifacts/ci-packages/yaml"

          dotnet pack PicoCfg/src/PicoCfg.Ini/PicoCfg.Ini.csproj \
            --configuration Release \
            --output ./artifacts/ci-nupkg \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=false \
            -p:RestoreSources="$NUGET_SOURCE" \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR" \
            -p:RestorePackagesPath="$GITHUB_WORKSPACE/artifacts/ci-packages/ini"

          dotnet pack PicoCfg/src/PicoCfg.Toml/PicoCfg.Toml.csproj \
            --configuration Release \
            --output ./artifacts/ci-nupkg \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=false \
            -p:RestoreSources="$NUGET_SOURCE" \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR" \
            -p:RestorePackagesPath="$GITHUB_WORKSPACE/artifacts/ci-packages/toml"

  # ---------------------------------------------------------------------------
  # PicoLog
  # ---------------------------------------------------------------------------
  validate-picolog:
    name: PicoLog (${{ matrix.logical-target }})
    needs: changes
    if: needs.changes.outputs.pico-log == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - logical-target: win-x64
            runs-on: windows-latest
            rid: win-x64
          - logical-target: win-arm64
            runs-on: windows-11-arm
            rid: win-arm64
          - logical-target: linux-x64
            runs-on: ubuntu-latest
            rid: linux-x64
          - logical-target: linux-arm64
            runs-on: ubuntu-24.04-arm
            rid: linux-arm64
          - logical-target: osx-arm64
            runs-on: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Linux AOT prerequisites
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
          if [[ "${{ matrix.rid }}" == "linux-arm64" ]]; then
            sudo apt-get install -y gcc binutils
          fi

      - name: Restore dependencies
        run: |
          mkdir -p ./artifacts/nupkg
          dotnet restore PicoLog/tests/PicoLog.Tests/PicoLog.Tests.csproj -p:UseProjectReferences=true -p:RestoreLockedMode=true
          dotnet restore PicoLog/tests/PicoLog.Json.Tests/PicoLog.Json.Tests.csproj -p:UseProjectReferences=true -p:RestoreLockedMode=true

      - name: Build
        run: |
          dotnet build PicoLog/tests/PicoLog.Tests/PicoLog.Tests.csproj --configuration Release --no-restore -p:UseProjectReferences=true
          dotnet build PicoLog/tests/PicoLog.Json.Tests/PicoLog.Json.Tests.csproj --configuration Release --no-restore -p:UseProjectReferences=true

      # --coverage-output names the report, because the default is a GUID filename and the upload
      # below needs to find it; the file lands in --results-directory, which is where the upload
      # reads from. (The previous upload path - <project>/TestResults/**/coverage.cobertura.xml -
      # matched nothing once --results-directory was passed, so the artifact was empty.)
      - name: Run PicoLog tests (coverage)
        if: matrix.rid == 'linux-x64'
        run: dotnet test --project PicoLog/tests/PicoLog.Tests/PicoLog.Tests.csproj --configuration Release --no-build --verbosity normal -p:UseProjectReferences=true --coverage --coverage-output picolog-tests.cobertura.xml --coverage-output-format cobertura -- --hangdump --hangdump-timeout 10m --hangdump-type Full --crashdump --crashdump-type Full --results-directory=${{ github.workspace }}/artifacts/test-results
      - name: Run PicoLog tests
        if: matrix.rid != 'linux-x64' && matrix.rid != 'linux-arm64'
        run: dotnet test --project PicoLog/tests/PicoLog.Tests/PicoLog.Tests.csproj --configuration Release --no-build --verbosity normal -p:UseProjectReferences=true -- --hangdump --hangdump-timeout 10m --hangdump-type Full --crashdump --crashdump-type Full --results-directory=${{ github.workspace }}/artifacts/test-results
      - name: Run PicoLog tests (linux-arm64 — increased parallelism, I/O-bound on slow VM)
        if: matrix.rid == 'linux-arm64'
        run: dotnet test --project PicoLog/tests/PicoLog.Tests/PicoLog.Tests.csproj --configuration Release --no-build --verbosity normal -p:UseProjectReferences=true -- --maximum-parallel-tests 4 --hangdump --hangdump-timeout 10m --hangdump-type Full --crashdump --crashdump-type Full --results-directory=${{ github.workspace }}/artifacts/test-results
      # SeqSink's tests live here now (the sink moved into this package), so these steps keep the
      # hang/crash-dump protection they had under the PicoLog.Tests steps above - and the coverage
      # leg runs them too: a PicoLog.Tests-only coverage leg describes a project that no longer
      # holds SeqSink.cs, so covering both projects is what keeps the picture whole.
      - name: Run PicoLog.Json tests (coverage)
        if: matrix.rid == 'linux-x64'
        run: dotnet test --project PicoLog/tests/PicoLog.Json.Tests/PicoLog.Json.Tests.csproj --configuration Release --no-build --verbosity normal -p:UseProjectReferences=true --coverage --coverage-output picolog-json-tests.cobertura.xml --coverage-output-format cobertura -- --hangdump --hangdump-timeout 10m --hangdump-type Full --crashdump --crashdump-type Full --results-directory=${{ github.workspace }}/artifacts/test-results
      - name: Run PicoLog.Json tests
        if: matrix.rid != 'linux-x64'
        run: dotnet test --project PicoLog/tests/PicoLog.Json.Tests/PicoLog.Json.Tests.csproj --configuration Release --no-build --verbosity normal -p:UseProjectReferences=true -- --hangdump --hangdump-timeout 10m --hangdump-type Full --crashdump --crashdump-type Full --results-directory=${{ github.workspace }}/artifacts/test-results
      # Diagnostic step: runs on a red job by design (see "Step gating policy" at the top).
      - name: Upload hang/crash dumps
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: picolog-dumps-${{ matrix.logical-target }}
          path: |
            ${{ github.workspace }}/artifacts/test-results/**
          if-no-files-found: ignore
          retention-days: 7
      # Diagnostic step: runs on a red job by design (see "Step gating policy" at the top).
      - name: Upload coverage
        if: ${{ !cancelled() && matrix.rid == 'linux-x64' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-picolog
          # Both coverage legs write here (--coverage-output names the report in each of them).
          # if-no-files-found: error, because an upload that silently matches nothing is how this
          # artifact stayed empty: a green job and an empty zip look the same.
          path: ${{ github.workspace }}/artifacts/test-results/*.cobertura.xml
          if-no-files-found: error

      # Diagnostic gate: runs on a red job by design (see "Step gating policy" at the top).
      - name: AOT publish validation
        if: ${{ !cancelled() }}
        run: dotnet publish PicoLog/src/PicoLog/ -p:PublishAot=true -r ${{ matrix.rid }} --configuration Release

      # Gated on purpose (implicit if: success()): nothing is shipped off a red test run.
      - name: Run PicoLog.Sample (managed smoke test)
        run: dotnet run --project PicoLog/samples/PicoLog.Sample/ -c Release -p:PublishAot=false

      # Gated on purpose (implicit if: success()): nothing is shipped off a red test run.
      - name: Pack CI packages (package-consumer validation)
        shell: bash
        run: |
          rm -rf ./artifacts/ci-nupkg
          rm -rf ./artifacts/ci-packages
          mkdir -p ./artifacts/ci-nupkg
          mkdir -p ./artifacts/ci-packages/abs ./artifacts/ci-packages/pico ./artifacts/ci-packages/di

          VERSION="0.0.0-ci"
          NUPKG_DIR="$GITHUB_WORKSPACE/artifacts/ci-nupkg"
          NUGET_SOURCE="https://api.nuget.org/v3/index.json"

          dotnet pack PicoLog/src/PicoLog.Abs/PicoLog.Abs.csproj \
            --configuration Release \
            --output ./artifacts/ci-nupkg \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=true \
            -p:RestoreSources="$NUGET_SOURCE" \
            -p:RestorePackagesPath="$GITHUB_WORKSPACE/artifacts/ci-packages/abs"

          dotnet pack PicoLog/src/PicoLog/PicoLog.csproj \
            --configuration Release \
            --output ./artifacts/ci-nupkg \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=false \
            -p:RestoreSources="$NUGET_SOURCE" \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR" \
            -p:RestorePackagesPath="$GITHUB_WORKSPACE/artifacts/ci-packages/pico"

          dotnet pack PicoLog/src/PicoLog.DI/PicoLog.DI.csproj \
            --configuration Release \
            --output ./artifacts/ci-nupkg \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=true \
            -p:RestoreSources="$NUGET_SOURCE" \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR" \
            -p:RestorePackagesPath="$GITHUB_WORKSPACE/artifacts/ci-packages/di"

          dotnet pack PicoLog/src/PicoLog.Json/PicoLog.Json.csproj \
            --configuration Release \
            --output ./artifacts/ci-nupkg \
            -p:Version="$VERSION" \
            -p:UseProjectReferences=false \
            -p:RestoreSources="$NUGET_SOURCE" \
            -p:RestoreAdditionalProjectSources="$NUPKG_DIR" \
            -p:RestorePackagesPath="$GITHUB_WORKSPACE/artifacts/ci-packages/json"

